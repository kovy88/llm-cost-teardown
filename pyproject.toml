[project]
name = "llm-cost-teardown"
version = "0.1.0"
description = "Find and prove savings in OpenAI / Anthropic API spend: caching, batch, routing, model migration."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Koval Matěj", email = "koval.matej88@seznam.cz" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.6",
]

[project.scripts]
llm-cost-teardown = "llm_cost_teardown:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anthropic>=1.9.0",
    "openai>=3.22.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
